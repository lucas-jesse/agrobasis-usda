name: Keep Streamlit Apps Alive

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping dashboards
        run: |
          curl -L --max-time 60 https://agrobasis-usda.streamlit.app/
          curl -L --max-time 60 https://agrobasis-usda-milho.streamlit.app/
          curl -L --max-time 60 https://usda-trigo.streamlit.app/
          curl -L --max-time 60 https://spread-milho.streamlit.app/
